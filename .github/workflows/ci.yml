# CI: runs on every push and pull request. Everything is offline: no Ollama, Qdrant, Postgres or
# arXiv. The tests use a fake model and fake tools, so they check our code, not qwen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # release.yml runs this before building a release

permissions:
  contents: read

concurrency:              # a new push cancels the old run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors, undefined names, unused code)
        run: pipx run ruff check .
      - name: Notebooks are valid
        run: |
          pip install nbformat
          python - <<'PY'
          import glob, nbformat
          paths = sorted(glob.glob("notebooks/*.ipynb"))
          for p in paths:
              nbformat.validate(nbformat.read(p, as_version=4))
          print(f"{len(paths)} notebooks valid")
          PY

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      OKF_GUARD_JAILBREAK: "0"      # don't download the ML jailbreak detector
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[agent]" pytest
      - name: Dependency conflicts
        run: pip check
      - name: Pytest
        run: pytest -v

  ui:
    name: UI imports (own env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Import ui/app.py with Chainlit 2.12 on Python 3.12, like start_backend.bat runs it
        working-directory: ui
        run: uv run --no-project --python 3.12 --with chainlit==2.12.0 python -c "import app; print('ok')"
