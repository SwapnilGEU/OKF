[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "okf"
version = "0.1.0"
description = "Question answering over the OKF bundle: hybrid retrieval (BM25 + Qdrant + links) and a local or API model"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "qdrant-client>=1.12",
    "requests",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.20,<2",              # 1.x: what langchain-mcp-adapters (LangGraph) works with
    "langchain-mcp-adapters>=0.1",    # stage 3: the agents load the MCP tools through this
]
agent = [
    "okf[mcp]",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2",   # chat memory in Postgres
    "psycopg[binary]>=3.2",               # Postgres driver (qa_log + checkpointer)
    "langsmith>=0.3",                     # optional tracing (off unless LANGSMITH_* is set)
    "langgraph-cli[inmem]>=0.4.36",       # `langgraph dev`: serves the agent over A2A (step 12)
    "langgraph-api>=0.16",                # the server behind it; A2A v1.0 (SendMessage)
    "httpx>=0.27",                        # the A2A client
    "uv>=0.5",                            # gives `uvx`, which runs third-party MCP servers (arXiv, step 13)
    "guardrails-ai>=0.11,<0.12",          # stage 4: guardrails (Guard, validators, on_fail actions)
    "guardrails-ai-valid-length>=0.1",    # hub validator: message length
    "guardrails-ai-secrets-present>=0.1", # hub validator: API keys / secrets in a message
]
guard-ml = [
    "guardrails-ai-detect-jailbreak>=0.1.6",   # ML prompt-injection / jailbreak detector (uses torch + transformers)
]

[tool.setuptools]
packages = ["okf", "okf_mcp", "okf_agent"]
